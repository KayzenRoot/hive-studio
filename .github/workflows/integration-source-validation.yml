name: Integration Source Contract

on:
  pull_request:
    paths:
      - integrations/gef-bootstrap
      - integrations/hive
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Verify pinned source versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned integrations
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify source SHAs and versions
        run: node scripts/verify-integration-sources.mjs
