name: GEF Source Validation

on:
  pull_request:
    paths:
      - integrations/gef-bootstrap
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gef-source-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: GEF v1.0.0 bounded full validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned integrations
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/gef-bootstrap/package-lock.json
      - name: Install locked GEF workspace dependencies
        working-directory: integrations/gef-bootstrap
        run: npm ci
      - name: Run GEF validation contract
        working-directory: integrations/gef-bootstrap
        run: npm run validate
      - name: Audit GEF workspace dependencies
        working-directory: integrations/gef-bootstrap
        run: npm audit --audit-level=high
